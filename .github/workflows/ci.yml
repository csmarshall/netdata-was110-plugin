name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff mypy types-requests

      - name: Ruff check
        run: ruff check was110.plugin

      - name: Ruff format check
        run: ruff format --check was110.plugin

      - name: Mypy
        run: mypy was110.plugin

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Verify plugin syntax
        run: python -m py_compile was110.plugin

      - name: Verify plugin imports
        run: python -c "import importlib.util; spec = importlib.util.spec_from_file_location('was110', 'was110.plugin'); mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)"

      - name: Test chart output format
        run: |
          # Run plugin briefly and verify it produces valid Netdata chart definitions
          timeout 5 python was110.plugin 1 2>/dev/null | head -40 > output.txt || true
          echo "--- Plugin output ---"
          cat output.txt
          echo "--- Validating ---"
          grep -q "^CHART was110.ploam_state" output.txt
          grep -q "^CHART was110.optical_power" output.txt
          grep -q "^CHART was110.signal_quality" output.txt
          grep -q "^CHART was110.temperature" output.txt
          grep -q "^CHART was110.electrical" output.txt
          grep -q "^CHART was110.connection_uptime" output.txt
          grep -q "^CHART was110.state_transitions" output.txt
          grep -q "^DIMENSION .* absolute 1 100" output.txt
          echo "All chart definitions valid"

      - name: Verify alarm config syntax
        run: |
          # Basic syntax validation of alarm config
          python -c "
          import re
          with open('was110-alarms.conf') as f:
              content = f.read()
          alarms = re.findall(r'^alarm:\s+\S+', content, re.MULTILINE)
          print(f'Found {len(alarms)} alarm definitions:')
          for a in alarms:
              print(f'  {a}')
          assert len(alarms) >= 8, f'Expected at least 8 alarms, found {len(alarms)}'
          print('Alarm config syntax OK')
          "

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: was110-test.sh

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and audit tool
        run: pip install requests urllib3 pip-audit

      - name: Audit dependencies
        run: pip-audit
