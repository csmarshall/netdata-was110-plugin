# WAS-110 XGS-PON Monitoring Configuration
# This file configures the Netdata external plugin for monitoring
# BFW Solutions WAS-110 XGS-PON SFP+ modules with 8311 firmware.

[global]
# WAS-110 device API endpoint
url = https://192.168.11.1/cgi-bin/luci/8311/metrics

# Authentication credentials
username = root
password = 8311

# Update interval in seconds (minimum 1, recommended 2-5)
update_every = 2

# HTTP timeout in seconds
timeout = 5

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level = INFO

[thresholds]
# RX power quality thresholds in dBm
# These define signal quality zones for percentage calculation
# and visual indicators in Netdata charts.
#
# Based on AT&T XGS-PON residential fiber experience:
# - Excellent: Strong signal, new installation quality
# - Good: Normal operation range
# - Acceptable: Monitor for degradation trends
# - Poor: Investigate fiber/connectors
# - Critical: Service likely impacted

rx_power_excellent = -21
rx_power_good = -25
rx_power_acceptable = -27
rx_power_poor = -30

# Temperature thresholds (optional, for future alerting)
# optic_temp_warning = 70
# optic_temp_critical = 80
# cpu_temp_warning = 80
# cpu_temp_critical = 90

# Electrical thresholds (optional, for future alerting)
# voltage_min = 3.0
# voltage_max = 3.6
# tx_bias_max = 20.0