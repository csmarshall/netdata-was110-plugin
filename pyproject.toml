[project]
name = "netdata-was110-plugin"
version = "1.0.0"
description = "Netdata external plugin for WAS-110 XGS-PON SFP+ monitoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Charles Marshall", email = "charles@wozi.com" }]
keywords = ["netdata", "was-110", "xgs-pon", "monitoring", "sfp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "requests>=2.25.0",
    "urllib3>=1.26.0",
]

[project.urls]
Repository = "https://github.com/csmarshall/netdata-was110-plugin"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["was110"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff.format]
# codebase style is single quotes; do not let the formatter churn the file
quote-style = "single"
