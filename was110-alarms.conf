# WAS-110 XGS-PON Netdata Health Alarms
# Place this file in /etc/netdata/health.d/

# PLOAM State Monitoring
# Alert when not in operational states (O5.1 = 51, O5.2 = 52)
alarm: was110_ploam_not_operational
   on: was110.ploam_state
 calc: $state
units: state
every: 10s
 warn: $this != 51 AND $this != 52 AND $this != 0
 crit: $this == 60 OR $this == 70
delay: up 30s down 10s
 info: WAS-110 not in operational PLOAM state (O5)
   to: sysadmin

# Signal Quality Based on RX Power
# Critical when signal quality drops below 40% (< -30 dBm)
alarm: was110_poor_signal_quality
   on: was110.signal_quality
 calc: $quality_percent
units: %
every: 10s
 warn: $this <= 60
 crit: $this <= 40
delay: up 60s down 30s
 info: WAS-110 signal quality degraded (RX power poor)
   to: sysadmin

# RX Power Monitoring
# Monitor optical power levels directly
alarm: was110_rx_power_low
   on: was110.optical_power
 calc: $rx_power / 100
units: dBm
every: 10s
 warn: $this <= -27
 crit: $this <= -30
delay: up 60s down 30s
 info: WAS-110 RX power is low (fiber degradation possible)
   to: sysadmin

# TX Power Monitoring
# Alert on abnormal TX power (too high or too low)
alarm: was110_tx_power_abnormal
   on: was110.optical_power
 calc: $tx_power / 100
units: dBm
every: 10s
 warn: $this <= 2 OR $this >= 8
 crit: $this <= 0 OR $this >= 10
delay: up 60s down 30s
 info: WAS-110 TX power abnormal (laser issue possible)
   to: sysadmin

# Temperature Monitoring
# Alert on high optic module temperature
alarm: was110_optic_temperature_high
   on: was110.temperature
 calc: $optic / 100
units: celsius
every: 30s
 warn: $this >= 70
 crit: $this >= 80
delay: up 120s down 60s
 info: WAS-110 optic module temperature high
   to: sysadmin

# CPU Temperature Monitoring
alarm: was110_cpu_temperature_high
   on: was110.temperature
 calc: max($cpu1, $cpu2) / 100
units: celsius
every: 30s
 warn: $this >= 80
 crit: $this >= 90
delay: up 120s down 60s
 info: WAS-110 CPU temperature high
   to: sysadmin

# Electrical Monitoring
# Monitor module voltage
alarm: was110_voltage_abnormal
   on: was110.electrical
 calc: $voltage / 100
units: volts
every: 30s
 warn: $this <= 3.0 OR $this >= 3.6
 crit: $this <= 2.8 OR $this >= 3.8
delay: up 60s down 30s
 info: WAS-110 module voltage abnormal
   to: sysadmin

# TX Bias Current Monitoring
alarm: was110_tx_bias_high
   on: was110.electrical
 calc: $tx_bias / 100
units: mA
every: 30s
 warn: $this >= 18
 crit: $this >= 22
delay: up 60s down 30s
 info: WAS-110 TX bias current high (laser aging possible)
   to: sysadmin

# Connection Stability
# Alert on frequent state transitions (connection instability)
alarm: was110_frequent_transitions
   on: was110.state_transitions
 calc: $total_transitions
units: transitions
every: 60s
 warn: $this - $this@300 >= 5
 crit: $this - $this@300 >= 10
delay: up 300s down 120s
 info: WAS-110 frequent state transitions detected (connection unstable)
   to: sysadmin

# Connection Uptime Monitoring
# Alert when connection uptime drops (indicates recent disconnect)
alarm: was110_connection_reset
   on: was110.connection_uptime
 calc: $uptime_seconds
units: seconds
every: 10s
 warn: $this < $this@60 AND $this < 300
delay: up 30s down 10s
 info: WAS-110 connection recently reset (uptime dropped)
   to: sysadmin

# Data Freshness Check
# Alert if plugin stops updating (no data for 2+ minutes)
alarm: was110_plugin_stale
   on: was110.ploam_state
 calc: $now - $last_collected_t
units: seconds
every: 30s
 warn: $this > 120
 crit: $this > 300
delay: up 60s down 30s
 info: WAS-110 plugin not updating (check plugin status)
   to: sysadmin